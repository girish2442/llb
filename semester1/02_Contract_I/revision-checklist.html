<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contract I – Revision Checklist</title><style>body{margin:0;background:#f4f7fb;color:#1f2937;font:16px/1.6 Arial}header{background:#173b63;color:white;padding:25px}main{max-width:900px;margin:25px auto;padding:0 16px}section{background:white;border:1px solid #dbe3ed;border-radius:12px;padding:18px}label{display:block;padding:12px;border-bottom:1px solid #e5e7eb}button{background:#245b91;color:white;border:0;padding:9px 13px;border-radius:8px;margin:10px 5px 0 0}@media print{header{background:white;color:#111}button{display:none}}</style></head><body><header><h1>Contract I – Revision Checklist</h1><p>KSLU LL.B. Semester I</p></header><main><p><a href="index.html">← Subject index</a> · <a href="../index.html">Central portal</a></p><section><p>Mark each unit after revision. Ticks are saved locally in this browser and are separate from the syllabus audit status.</p><label><input type="checkbox" data-id="1"> Unit 1: read notes, attempt questions, verify cases/statutes and revise</label><label><input type="checkbox" data-id="2"> Unit 2: read notes, attempt questions, verify cases/statutes and revise</label><label><input type="checkbox" data-id="3"> Unit 3: read notes, attempt questions, verify cases/statutes and revise</label><label><input type="checkbox" data-id="4"> Unit 4: read notes, attempt questions, verify cases/statutes and revise</label><label><input type="checkbox" data-id="5"> Unit 5: read notes, attempt questions, verify cases/statutes and revise</label><button onclick="window.print()">Print checklist</button><button onclick="resetChecks()">Reset</button></section></main><script>const key='kslu-revision-02_Contract_I';const boxes=[...document.querySelectorAll('input')];let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}boxes.forEach(b=>{b.checked=!!state[b.dataset.id];b.addEventListener('change',()=>{state[b.dataset.id]=b.checked;localStorage.setItem(key,JSON.stringify(state))})});function resetChecks(){if(confirm('Reset this subject checklist?')){localStorage.removeItem(key);boxes.forEach(b=>b.checked=false);state={}}}</script></body></html>
